version: 2
updates:
  - package-ecosystem: npm
    directory: /artifacts/fun-with-flags
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      ui-dev:
        dependency-type: development
  - package-ecosystem: uv
    directory: /artifacts/api-server/python
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: docker
    directories:
      - /artifacts/fun-with-flags
      - /artifacts/api-server/python
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
