{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "funwithflags.fullname" . }}-api
  labels:
    {{- include "funwithflags.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "funwithflags.selectorLabels" (dict "root" . "component" "api") | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "funwithflags.selectorLabels" (dict "root" . "component" "ui") | nindent 14 }}
        {{- with .Values.networkPolicy.extraIngressFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - port: 8000
          protocol: TCP
{{- end }}
