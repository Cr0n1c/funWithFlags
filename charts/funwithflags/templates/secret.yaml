{{- if not .Values.secrets.existingSecret }}
{{- $s := .Values.secrets.values }}
{{- if not $s.SESSION_SECRET }}{{ fail "secrets.values.SESSION_SECRET is required when secrets.existingSecret is not set" }}{{ end }}
{{- if not $s.FLAG_HASH_SECRET }}{{ fail "secrets.values.FLAG_HASH_SECRET is required when secrets.existingSecret is not set" }}{{ end }}
{{- if not $s.OKTA_CLIENT_SECRET }}{{ fail "secrets.values.OKTA_CLIENT_SECRET is required when secrets.existingSecret is not set" }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "funwithflags.fullname" . }}
  labels:
    {{- include "funwithflags.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  OKTA_CLIENT_SECRET: {{ $s.OKTA_CLIENT_SECRET | quote }}
  SESSION_SECRET: {{ $s.SESSION_SECRET | quote }}
  FLAG_HASH_SECRET: {{ $s.FLAG_HASH_SECRET | quote }}
  {{- with $s.DATABASE_URL }}
  DATABASE_URL: {{ . | quote }}
  {{- end }}
  {{- range $k, $v := $s }}
  {{- if not (has $k (list "OKTA_CLIENT_SECRET" "SESSION_SECRET" "FLAG_HASH_SECRET" "DATABASE_URL")) }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- end }}
{{- end }}
