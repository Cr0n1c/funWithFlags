apiVersion: v1
kind: Pod
metadata:
  name: {{ include "funwithflags.fullname" . }}-test-connection
  labels:
    {{- include "funwithflags.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: curl
      image: curlimages/curl:8.16.0
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      command: ["sh", "-c"]
      args:
        - |
          set -e
          curl -fsS "http://{{ include "funwithflags.uiServiceName" . }}:{{ .Values.ui.service.port }}/healthz"
          curl -fsS "http://{{ include "funwithflags.uiServiceName" . }}:{{ .Values.ui.service.port }}/api/health"
          curl -fsS "http://{{ include "funwithflags.uiServiceName" . }}:{{ .Values.ui.service.port }}/api/ready"
