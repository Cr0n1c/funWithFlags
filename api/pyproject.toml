[project]
name = "funwithflags-api"
version = "2.0.0"
description = "FastAPI middleware for the Fun With Flags CTF: Okta OIDC login, flag submission, leaderboard."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Brandon Helms" }]
dependencies = [
    "fastapi>=0.118",
    "uvicorn[standard]>=0.37",
    "sqlalchemy[asyncio]>=2.0.43",
    "asyncpg>=0.30",
    "alembic>=1.16",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "httpx>=0.28",
    "pyjwt[crypto]>=2.10",
    "pyyaml>=6.0.2",
    "structlog>=25.4",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.1",
    "aiosqlite>=0.21",
    "ruff>=0.13",
    "ty>=0.0.1a20",
    "respx>=0.22",
    "types-pyyaml>=6.0.12",
]

[project.scripts]
funwithflags-api = "app.cli:main"

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[tool.uv]
# Supply-chain cooldown: never resolve to a release published in the last week.
exclude-newer = "1 week"
# Rebuild the project wheel whenever application code changes, not just pyproject.toml.
# Without this, Docker builds with a uv cache mount can install a stale copy of `app`.
cache-keys = [{ file = "pyproject.toml" }, { file = "app/**/*.py" }, { file = "app/**/*.mako" }]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF", "PL"]
ignore = ["PLR0913", "PLR0917", "PLR2004", "S101"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "RUF029"]
"app/alembic/**" = ["E501", "F401"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ty.environment]
python-version = "3.13"
